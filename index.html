<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Radio</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="menu" class="menu" role="menu" aria-label="Radio">
      <div class="header">
        <span class="title">Radio</span>
      </div>

      <div class="now" aria-live="polite">
        <div class="now-meta">
          <span id="badge" class="badge badge-paused">PAUSED</span>
          <span id="meta" class="meta"></span>
        </div>
        <div id="programme" class="programme"></div>
      </div>

      <div class="controls">
        <button id="play" class="round" aria-label="Play">
          <svg class="glyph glyph-play" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.2v9.6c0 .5.5.8.9.5l7.4-4.8c.4-.3.4-.8 0-1.1L3.4.7c-.4-.3-.9 0-.9.5z" /></svg>
          <svg class="glyph glyph-pause" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="1" width="2.6" height="10" rx=".8" /><rect x="6.9" y="1" width="2.6" height="10" rx=".8" /></svg>
        </button>
        <div id="volume" class="volume" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65">
          <div id="volume-fill" class="volume-fill"></div>
          <svg class="speaker" width="16" height="12" viewBox="0 0 16 12" aria-hidden="true">
            <path d="M1 4.2h2.4L6.6 1.4c.4-.3.9-.1.9.4v8.4c0 .5-.5.7-.9.4L3.4 7.8H1c-.3 0-.5-.2-.5-.5V4.7c0-.3.2-.5.5-.5z" />
            <path class="wave wave-1" d="M9.4 4.1a2.7 2.7 0 0 1 0 3.8" />
            <path class="wave wave-2" d="M11.3 2.4a5.1 5.1 0 0 1 0 7.2" />
          </svg>
        </div>
      </div>

      <div class="sep"></div>

      <div class="section">Stations</div>
      <div id="stations"></div>

      <div class="sep sep-lg"></div>

      <div id="sleep-row" class="row" role="menuitem" aria-haspopup="true" aria-expanded="false" tabindex="-1">
        <span>Sleep Timer</span>
        <span class="row-right"><span id="sleep-label" class="tabular">Off</span><span class="chev" aria-hidden="true">›</span></span>
      </div>
      <div id="sleep-options" class="sub" role="menu" hidden></div>

      <div id="login-row" class="row" role="menuitemcheckbox" aria-checked="false" tabindex="-1">
        <span>Launch at Login</span>
        <span id="login-switch" class="switch switch-sm"><span class="knob"></span></span>
      </div>
      <div id="label-row" class="row" role="menuitemcheckbox" aria-checked="true" tabindex="-1">
        <span>Show Station in Menu Bar</span>
        <span id="label-switch" class="switch switch-sm on"><span class="knob"></span></span>
      </div>

      <div class="sep sep-lg"></div>

      <div id="logs-row" class="row" role="menuitem" tabindex="-1">
        <span>Open Logs…</span><span class="shortcut">⌥⌘L</span>
      </div>
      <div id="quit-row" class="row" role="menuitem" tabindex="-1">
        <span>Quit Radio</span><span class="shortcut">⌘Q</span>
      </div>
    </div>

    <audio id="audio" preload="none"></audio>
  </body>
</html>
